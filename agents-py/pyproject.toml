[project]
name = "coding-agent-py"
version = "0.1.0"
description = "Coding-Agent Python agent service (pydantic-ai). Nemotron on Nebius Token Factory by default."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pydantic-ai-slim[openai]>=1.0",
  "pydantic-graph>=1.0",
  "pydantic-evals>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
